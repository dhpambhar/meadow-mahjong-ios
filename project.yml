# XcodeGen spec. On the Mac:
#   brew install xcodegen
#   cd MeadowMahjong && xcodegen generate && open MeadowMahjong.xcodeproj
# Re-run `xcodegen generate` after adding or removing files.

name: MeadowMahjong
options:
  bundleIdPrefix: com.example          # replace with your reverse domain before TestFlight
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  xcodeVersion: "16.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    DEVELOPMENT_TEAM: ""               # set your team ID, or pick it in Signing & Capabilities
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1,2"      # iPhone and iPad
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  MeadowMahjong:
    type: application
    platform: iOS
    scheme:
      testTargets:
        - MeadowMahjongTests
    sources:
      - path: MeadowMahjong
    info:
      path: MeadowMahjong/Info.plist
      properties:
        CFBundleDisplayName: Meadow Mahjong
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UIStatusBarHidden: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.MeadowMahjong
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: true
        ENABLE_PREVIEWS: true

  MeadowMahjongTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: MeadowMahjongTests
    dependencies:
      - target: MeadowMahjong
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.MeadowMahjongTests
        GENERATE_INFOPLIST_FILE: true
